<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1a73e8">
    <title>Caja Pastelitos PRO - Ajustada</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Outfit', sans-serif; background: #f8f9fa; padding: 15px; display: flex; justify-content: center; }
        .container { max-width: 400px; width: 100%; background: white; padding: 20px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
        .input-group { margin-bottom: 12px; }
        label { font-size: 0.8em; font-weight: 700; color: #5f6368; margin-bottom: 4px; display: block; }
        input { font-family: 'Outfit'; width: 100%; padding: 12px; border: 2px solid #e0e0e0; border-radius: 10px; box-sizing: border-box; font-size: 16px; }
        .row { display: flex; gap: 10px; }
        .result-box { background: #e8f0fe; padding: 12px; border-radius: 12px; margin-top: 10px; text-align: center; }
        .val { font-weight: 800; font-size: 1.2em; color: #1a73e8; display: block; }
        .vuelto-especial { background: #fff3cd; padding: 15px; border-radius: 16px; margin-top: 15px; text-align: center; border: 2px solid #ffeeba; }
    </style>
</head>
<body>
    <div class="container">
        <div class="row">
            <div class="input-group">
                <label>TASA ($)</label>
                <input type="number" id="tasa" value="750">
            </div>
            <div class="input-group">
                <label>PRECIO COMBO (Bs)</label>
                <input type="number" id="precioCombo" value="800">
            </div>
        </div>
        <div class="input-group">
            <label>CANTIDAD DE COMBOS</label>
            <input type="number" id="combos" placeholder="0">
        </div>
        <div class="row">
            <div class="input-group">
                <label>OTROS ($)</label>
                <input type="number" id="otrosUSD" placeholder="0.00">
            </div>
            <div class="input-group">
                <label>OTROS (Bs)</label>
                <input type="number" id="otrosBS" placeholder="0.00">
            </div>
        </div>
        <div class="result-box">
            <label>TOTAL A PAGAR</label>
            <span id="totalBs" class="val">0.00 Bs</span>
            <span id="totalUsd" class="val" style="color: #0d652d; font-size: 1em;">0.00 $</span>
        </div>
        <div class="input-group" style="margin-top: 15px;">
            <label>PAGA CON ($)</label>
            <input type="number" id="pagoUSD" placeholder="0.00">
        </div>
        <div class="result-box" style="background: #e1f5fe;">
            <label>VUELTO TOTAL ($)</label>
            <span id="vueltoTotalUSD" class="val">0.00 $</span>
        </div>
        <div class="result-box" style="background: #e1f5fe;">
            <label>VUELTO TOTAL (Bs)</label>
            <span id="vueltoTotalBS" class="val">0.00 Bs</span>
        </div>
        <div class="vuelto-especial">
            <label style="color: #856404; margin-bottom: 5px;">VUELTO SOLO DECIMALES (en Bs):</label>
            <span style="font-weight: 600;">Vuelto de <span id="labelDinamico">0.00</span>$ en Bolívares:</span>
            <div id="soloDecimalesBS" style="font-size: 1.8em; font-weight: 800; color: #d9534f;">0.00 Bs</div>
        </div>
    </div>

<script>
    const tasa = document.getElementById('tasa');
    const precioCombo = document.getElementById('precioCombo');
    const combos = document.getElementById('combos');
    const usd = document.getElementById('otrosUSD');
    const bs = document.getElementById('otrosBS');
    const pago = document.getElementById('pagoUSD');

    // Al cargar, recuperar los valores guardados
    window.onload = () => {
        tasa.value = localStorage.getItem('tasa') || '750';
        precioCombo.value = localStorage.getItem('precioCombo') || '800';
        calcular();
    };

    // Guardar al cambiar
    [tasa, precioCombo].forEach(el => {
        el.addEventListener('input', () => {
            localStorage.setItem(el.id, el.value);
            calcular();
        });
    });

    usd.addEventListener('input', () => { if(usd.value) bs.value = (usd.value * tasa.value).toFixed(2); calcular(); });
    bs.addEventListener('input', () => { if(bs.value) usd.value = (bs.value / tasa.value).toFixed(2); calcular(); });
    [combos, pago].forEach(el => el.addEventListener('input', calcular));

    function calcular() {
        const t = parseFloat(tasa.value) || 0;
        const pC = parseFloat(precioCombo.value) || 0;
        const c = parseFloat(combos.value) || 0;
        const oUSD = parseFloat(usd.value) || 0;
        const oBS = parseFloat(bs.value) || 0;
        const pUSD = parseFloat(pago.value) || 0;

        const totalEnBs = (c * pC) + oBS;
        const totalEnUSD = c + oUSD;

        document.getElementById('totalBs').innerText = totalEnBs.toLocaleString('es-VE', {minimumFractionDigits: 2}) + " Bs";
        document.getElementById('totalUsd').innerText = totalEnUSD.toFixed(2) + " $";

        if (pUSD > 0) {
            const vTotalUSD = pUSD - totalEnUSD;
            const vueltoTotalBs = vTotalUSD * t;
            
            document.getElementById('vueltoTotalUSD').innerText = vTotalUSD.toFixed(2) + " $";
            document.getElementById('vueltoTotalBS').innerText = vueltoTotalBs.toLocaleString('es-VE', {minimumFractionDigits: 2}) + " Bs";

            const decimales = vTotalUSD - Math.floor(vTotalUSD);
            const decBs = decimales * t;

            document.getElementById('labelDinamico').innerText = decimales.toFixed(2);
            document.getElementById('soloDecimalesBS').innerText = decBs.toLocaleString('es-VE', {minimumFractionDigits: 2}) + " Bs";
        }
    }
</script>
<script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('./sw.js')
      .then(() => console.log('Service Worker registrado con éxito'))
      .catch((err) => console.log('Error al registrar Service Worker', err));
  }
</script>
</body>
</html>
